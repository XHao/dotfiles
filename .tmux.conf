# ~/.tmux.conf —— tmux 配置（bootstrap 软链自 ~/dotfiles/.tmux.conf）
# 给 Terminal.app 补上分屏与会话持久化。前缀保持默认 Ctrl-b：
# zsh 里它的光标左移用 ← 替代，vim 翻页不用它——冲突成本最低的选择
# 机器私有配置放 ~/.tmux.conf.local（文末钩子加载，不入库）

# ---- 1. 基础体验 ----
set -g mouse on                # 鼠标滚动(自动进 copy mode)/点击切窗格/拖边框调大小
set -s escape-time 0           # 消除 vim 按 ESC 的延迟
set -g history-limit 50000     # 每窗格滚回区 5 万行（与 HISTSIZE 同量级）
set -g base-index 1            # 窗口/窗格编号从 1 起，与键盘数字键对齐
setw -g pane-base-index 1
set -g renumber-windows on     # 关窗口后其余自动补位，编号不断档
set -g set-titles on           # 外层终端标题跟随 tmux，模板见下一行
set -g set-titles-string '#S:#I:#W - "#T" #{session_alerts}'   # #T=pane 标题，由 Claude Code 等程序写入

# ---- 2. 颜色（macOS + Terminal.app）----
# Tahoe Terminal 已支持 24-bit 真彩，Tc 把它透传进 tmux；
# default-terminal 用 screen-256color：macOS 自带该 terminfo（tmux-256color 需另装）
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*:Tc"

# ---- 3. 分屏与窗格（默认的 % 和 " 难记，改 | 和 -）----
bind | split-window -h -c "#{pane_current_path}"   # | 左右分屏
bind - split-window -v -c "#{pane_current_path}"   # - 上下分屏
bind h select-pane -L                              # 前缀 h/j/k/l 切窗格（方向键仍可用）
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- 4. 复制：copy mode 用 vi 键位，结果直达系统剪贴板 ----
setw -g mode-keys vi
set -s copy-command "pbcopy"                         # copy-pipe 系命令的默认管道
bind -T copy-mode-vi v send -X begin-selection                      # v 开始选择
bind -T copy-mode-vi y send -X copy-pipe-and-cancel                 # y 复制并回到底部
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel # 鼠标拖选松手即复制
# 回滚：前缀 [ 进入；Ctrl-b/f 整页、Ctrl-u/d 半页、/ 搜索、q 退出

# ---- 5. 同步输入：一键广播到当前窗口所有窗格（用完立刻关！）----
bind S setw synchronize-panes \; display "同步输入: #{?pane_synchronized,ON ⚠️,OFF}"

# ---- 6. 热重载：改完配置不用退出会话 ----
bind r source-file ~/.tmux.conf \; display "已重载 ~/.tmux.conf"

# ---- 7. 自然语言命令窗口（前缀+a，翻译层零工具，见 55-nlwin.zsh）----
# display-popup 由 server 派生且 tmux 3.7c 不展开其参数中的 #{} 格式：
# 先 run-shell（按键上下文，可展开）把触发窗格 %id 存进 server env，popup 继承
bind a run-shell 'tmux set-environment -g NLWIN_TARGET "#{pane_id}"' \; display-popup -E -w 80% -h 60% -T 'nl 自然语言命令' \
    "zsh $HOME/dotfiles/zshrc.d/55-nlwin.zsh \"\""

# ---- 8. 状态栏主题: Dracula（powerline 箭头，依赖 Nerd Font）----
# 主题体在 ~/.tmux/dracula（独立仓手动安装，不引入 tpm；bootstrap 步骤 5 克隆，
# 失败时下方 run-shell 静默跳过、状态栏回落 tmux 默认样式）
# 段配置：@dracula-plugins 顺序即显示顺序；天气走 wttr.in（脚本自带 1s 预检），
# 定位默认按出口 IP，固定城市可加: set -g @dracula-location "Shanghai"
# 注意: 主题为固定深色底，不再跟随终端深浅色切换
set -g status-interval 5
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-plugins "cpu-usage ram-usage battery weather time"
set -g @dracula-show-fahrenheit false
set -g @dracula-show-location false
set -g @dracula-show-timezone false
# 出口 IP 非 CN（代理出海，如东京出口）或探测失败时，钉死上海防定位漂移到境外；
# 国内直连则留空走 wttr.in 自动定位。同步 if-shell（不加 -b）：dracula 会把
# fixed_location 烘焙进状态栏 #() 命令串，判定必须先于下方 run-shell 完成；
# 切换网络（开关代理）后 前缀 r 热重载即可重判。天气结果另有 20 分钟缓存
# （/tmp/.dracula-tmux-weather-data），改定位后删它可立即生效
if-shell '! curl -s --max-time 3 https://ipinfo.io/country | grep -q "^CN$"' \
    'set -g @dracula-fixed-location "Shanghai"'
run-shell ~/.tmux/dracula/dracula.tmux

# ---- 9. 本机钩子（对齐 .zshrc.local 模式）----
if-shell '[ -f ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'
