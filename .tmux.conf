# ~/.tmux.conf —— tmux 配置（bootstrap 软链自 ~/dotfiles/.tmux.conf）
# 给 Terminal.app 补上分屏与会话持久化。前缀保持默认 Ctrl-b：
# zsh 里它的光标左移用 ← 替代，vim 翻页不用它——冲突成本最低的选择
# 机器私有配置放 ~/.tmux.conf.local（文末钩子加载，不入库）

# ---- 1. 基础体验 ----
set -g mouse on                # 鼠标滚动(自动进 copy mode)/点击切窗格/拖边框调大小
set -s escape-time 0           # 消除 vim 按 ESC 的延迟
set -g history-limit 50000     # 每窗格滚回区 5 万行（与 HISTSIZE 同量级）
set -g base-index 1            # 窗口/窗格编号从 1 起，与键盘数字键对齐
setw -g pane-base-index 1
set -g renumber-windows on     # 关窗口后其余自动补位，编号不断档
set -g set-titles on           # 外层终端标题跟随 tmux，模板见下一行
set -g set-titles-string '#S:#I:#W - "#T" #{session_alerts}'   # #T=pane 标题，由 Claude Code 等程序写入

# ---- 2. 颜色（macOS + Terminal.app）----
# Tahoe Terminal 已支持 24-bit 真彩，Tc 把它透传进 tmux；
# default-terminal 用 screen-256color：macOS 自带该 terminfo（tmux-256color 需另装）
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*:Tc"

# ---- 3. 分屏与窗格（默认的 % 和 " 难记，改 | 和 -）----
bind | split-window -h -c "#{pane_current_path}"   # | 左右分屏
bind - split-window -v -c "#{pane_current_path}"   # - 上下分屏
bind h select-pane -L                              # 前缀 h/j/k/l 切窗格（方向键仍可用）
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- 4. 复制：copy mode 用 vi 键位，结果直达系统剪贴板 ----
setw -g mode-keys vi
set -s copy-command "pbcopy"                         # copy-pipe 系命令的默认管道
bind -T copy-mode-vi v send -X begin-selection                      # v 开始选择
bind -T copy-mode-vi y send -X copy-pipe-and-cancel                 # y 复制并回到底部
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel # 鼠标拖选松手即复制
# 回滚：前缀 [ 进入；Ctrl-b/f 整页、Ctrl-u/d 半页、/ 搜索、q 退出

# ---- 5. 同步输入：一键广播到当前窗口所有窗格（用完立刻关！）----
bind S setw synchronize-panes \; display "同步输入: #{?pane_synchronized,ON ⚠️,OFF}"

# ---- 6. 热重载：改完配置不用退出会话 ----
bind r source-file ~/.tmux.conf \; display "已重载 ~/.tmux.conf"

# ---- 7. AI 窗口（前缀+a 自然语言→命令，翻译层零工具，见 55-nlwin.zsh；
#        前缀+A 多轮对话问答，见 56-aiwin.zsh——同管道零工具，绿色边框区分）----
# display-popup 由 server 派生且 tmux 3.7c 不展开其参数中的 #{} 格式：
# 先 run-shell（按键上下文，可展开）把触发窗格 %id 存进 server env，popup 继承
bind a run-shell 'tmux set-environment -g NLWIN_TARGET "#{pane_id}"' \; display-popup -E -b rounded -S 'fg=#83c092' -w 80% -h 60% -T 'nl 自然语言命令' \
    "zsh $HOME/dotfiles/zshrc.d/55-nlwin.zsh \"\""
bind A display-popup -E -b rounded -S 'fg=#a7c080' -w 80% -h 75% -T 'AI 对话 · r 回看 · q 退出' \
    "zsh $HOME/dotfiles/zshrc.d/56-aiwin.zsh"

# ---- 8. 状态栏主题: Dracula 引擎 + Everforest 配色（powerline 箭头，依赖 Nerd Font）----
# 主题体在 ~/.tmux/dracula（第三方独立仓，走 clones.txt 清单由 bootstrap 步骤 5 /
# dfm u 自动克隆，不引入 tpm；缺失时下方 run-shell 静默跳过、状态栏回落 tmux 默认样式）。
# 克隆源为自有 fork XHao/tmux：携带 weather.sh 图标映射修复（上游只认 5 个天气词，
# 其余一律兜底成 ☀，雾/毛毛雨/阵雪全被显示成晴天）；上游合并后可指回官方源
# 段配置：@dracula-plugins 顺序即显示顺序；天气走 wttr.in（脚本自带 1s 预检），
# 定位默认按出口 IP，固定城市可加: set -g @dracula-location "Shanghai"
# 注意: 主题为固定深色底，不再跟随终端深浅色切换
set -g status-interval 5
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-plugins "cpu-usage ram-usage battery weather time"
# 调色盘整盘覆盖成 Everforest soft（对齐 vim: colorscheme everforest + soft 底，
# 色值同源 ~/.vim/plugged/everforest/palette.md）。dracula.sh 对本选项做 eval
# 重定义全部 12 个色变量——引擎/面板/箭头全保留，只换皮。语义对位：
# gray→bg1 状态栏底、dark_gray→bg0 段上深字（vim 编辑区底色）、white→fg、
# green→session 段（vim statusline1）、orange→cpu/天气、cyan→blue→ram、
# pink→purple→battery（everforest 无 pink）、dark_purple→bg3→time/活动tab、
# light_purple→aqua→活动边框 contrast、yellow→prefix 按下指示、red→警示
set -g @dracula-colors "white=#d3c6aa gray=#3a464c dark_gray=#333c43 light_purple=#83c092 dark_purple=#4d5960 cyan=#7fbbb3 green=#a7c080 orange=#e69875 red=#e67e80 purple=#d699b6 pink=#d699b6 yellow=#dbbc7f"
# 电池段：主题默认 label ♥ 与百分比之间无空格（♥94%），macOS 把 ♥ 按 emoji 宽字形
# 渲染而步进仅一格 → 心形压住数字。关 label、开状态图标 → 「󰂂 94%」（图标后自带
# 空格，分电量 10 档 + 放电/充电两套切换）。脚本里 declare -A 在系统 bash 3.2 下
# 报错但仍按索引数组完成赋值（键恰为 0~100 数字），图标照常生效；报错走 stderr，
# tmux 丢弃 #() 任务的 stderr，不上状态栏——勿为图标装 bash
set -g @dracula-battery-label false
set -g @dracula-show-battery-status true
# 电池段接交流电（pmset 报 AC Power）时整段隐藏——本机为 Mac mini 无电池，
# 该段本就恒显无意义的 AC 字样；MacBook 插电隐藏、用电池时回归。
# hide-on-ac 是 fork 补丁选项；show-empty-plugins false 为配套（dracula 原生）：
# 默认对空输出段仍渲染空色块+箭头，关掉才连箭头整段省略
set -g @dracula-battery-hide-on-ac true
set -g @dracula-show-empty-plugins false
set -g @dracula-show-fahrenheit false
set -g @dracula-show-location true
set -g @dracula-show-timezone false
# 出口 IP 非 CN（代理出海，如东京出口）或探测失败时，钉死上海防定位漂移到境外；
# 国内直连则留空走 wttr.in 自动定位。同步 if-shell（不加 -b）：dracula 会把
# fixed_location 烘焙进状态栏 #() 命令串，判定必须先于下方 run-shell 完成；
# 切换网络（开关代理）后 前缀 r 热重载即可重判。天气结果另有 20 分钟缓存
# （/tmp/.dracula-tmux-weather-data），改定位后删它可立即生效
if-shell '! curl -s --max-time 3 https://ipinfo.io/country | grep -q "^CN$"' \
    'set -g @dracula-fixed-location "Shanghai"'
run-shell ~/.tmux/dracula/dracula.tmux

# Dracula 引擎只接管状态栏，以下面级补齐它没管的显示面（配色取自 Everforest
# soft，与上方 @dracula-colors 同源）；注意窗格边框无圆角字形（合法值
# single/double/heavy/number/simple，man 实证），弹窗才有 rounded——见第 7 段 bind a
set -g pane-border-style "fg=#3a464c"              # 非活动窗格: bg1（与状态栏底同色，弱化隐形）
set -g pane-active-border-style "fg=#83c092"       # 活动窗格: aqua（light_purple 语义位）
set -g message-style "bg=#3a464c,fg=#d3c6aa"       # 命令弹条/确认提示
setw -g mode-style "bg=#a7c080,fg=#333c43"         # copy-mode 选区: green 底深字（vim Search 同色）

# ---- 9. 本机钩子（对齐 .zshrc.local 模式）----
if-shell '[ -f ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'
