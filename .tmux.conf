# ~/.tmux.conf —— tmux 配置（bootstrap 软链自 ~/dotfiles/.tmux.conf）
# 给 Terminal.app 补上分屏与会话持久化。前缀保持默认 Ctrl-b：
# zsh 里它的光标左移用 ← 替代，vim 翻页不用它——冲突成本最低的选择
# 机器私有配置放 ~/.tmux.conf.local（文末钩子加载，不入库）

# ---- 1. 基础体验 ----
set -g mouse on                # 鼠标滚动(自动进 copy mode)/点击切窗格/拖边框调大小
set -s escape-time 0           # 消除 vim 按 ESC 的延迟
set -g history-limit 50000     # 每窗格滚回区 5 万行（与 HISTSIZE 同量级）
set -g base-index 1            # 窗口/窗格编号从 1 起，与键盘数字键对齐
setw -g pane-base-index 1
set -g renumber-windows on     # 关窗口后其余自动补位，编号不断档
set -g set-titles on           # 外层终端标题跟随 tmux，模板见下一行
set -g set-titles-string '#S:#I:#W - "#T" #{session_alerts}'   # #T=pane 标题，由 Claude Code 等程序写入

# ---- 2. 颜色（macOS + Terminal.app）----
# Tahoe Terminal 已支持 24-bit 真彩，Tc 把它透传进 tmux；
# default-terminal 用 screen-256color：macOS 自带该 terminfo（tmux-256color 需另装）
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*:Tc"

# ---- 3. 分屏与窗格（默认的 % 和 " 难记，改 | 和 -）----
bind | split-window -h -c "#{pane_current_path}"   # | 左右分屏
bind - split-window -v -c "#{pane_current_path}"   # - 上下分屏
bind h select-pane -L                              # 前缀 h/j/k/l 切窗格（方向键仍可用）
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- 4. 复制：copy mode 用 vi 键位，结果直达系统剪贴板 ----
setw -g mode-keys vi
set -s copy-command "pbcopy"                         # copy-pipe 系命令的默认管道
bind -T copy-mode-vi v send -X begin-selection                      # v 开始选择
bind -T copy-mode-vi y send -X copy-pipe-and-cancel                 # y 复制并回到底部
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel # 鼠标拖选松手即复制
# 回滚：前缀 [ 进入；Ctrl-b/f 整页、Ctrl-u/d 半页、/ 搜索、q 退出

# ---- 5. 同步输入：一键广播到当前窗口所有窗格（用完立刻关！）----
bind S setw synchronize-panes \; display "同步输入: #{?pane_synchronized,ON ⚠️,OFF}"

# ---- 6. 热重载：改完配置不用退出会话 ----
bind r source-file ~/.tmux.conf \; display "已重载 ~/.tmux.conf"

# ---- 7. Powerline 状态栏（agnoster 同款蓝灰 +  箭头，依赖 Nerd Font）----
set -g status-interval 60
set -g status-style "bg=default"                    # 底色透传终端背景，跟随深浅色
set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#[fg=colour15,bg=colour33,bold] #S #[fg=colour33,bg=default,nobold] '
setw -g window-status-separator ''
setw -g window-status-format '#[fg=colour249,bg=colour237] #I #W #[fg=colour243,bg=colour237]· #T #[fg=colour237,bg=default] '
setw -g window-status-current-format '#[fg=colour0,bg=colour39,bold] #I #W #[fg=colour18,bg=colour39,nobold]· #T #[fg=colour39,bg=default,nobold] '
# 窗口条目 = 编号 进程名 · pane 标题(普通 shell=当前目录,Claude=✳ 任务)
set -g status-right '#[fg=colour237,bg=default] #[fg=colour15,bg=colour33] %H:%M '
set -g pane-border-style "fg=colour237"       # 窗格边框深灰
set -g pane-active-border-style "fg=colour33" # 活动窗格边框亮蓝

# ---- 8. 本机钩子（对齐 .zshrc.local 模式）----
if-shell '[ -f ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'
